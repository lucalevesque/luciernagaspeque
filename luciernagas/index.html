<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>🌙</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#050b1f;overflow:hidden;font-family:'VT323','Courier New',monospace;color:#ffe9a8;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;display:flex;justify-content:center}
#wrap{position:relative;height:100%}
canvas{height:100%;width:100%;image-rendering:pixelated;touch-action:none;display:block}
.txt{position:absolute;left:0;right:0;box-sizing:border-box;text-align:center;padding:0 9%;font-size:27px;line-height:1.1;text-shadow:0 0 8px #000c,0 1px 0 #000;opacity:0;transition:opacity 1.6s;pointer-events:none}
.txt.on{opacity:1}
#final{top:17%}
#sign{top:23%;font-size:24px;color:#ffd95a}
#secret{bottom:7%;transition:opacity .6s}
#days{top:15%;left:auto;right:4%;padding:0;font-size:21px;text-align:right;color:#cfe3ff;transition:opacity .6s}
#bubble{top:0;left:0;right:auto;padding:0;font-size:22px;color:#e9f1ff;transform:translateX(-50%);transition:opacity .3s}
#intro{position:fixed;inset:0;z-index:5;background:#050b1f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity 1.4s;cursor:pointer}
#intro.off{opacity:0;pointer-events:none}
#intro i{width:14px;height:14px;border-radius:50%;background:#ffd95a;box-shadow:0 0 18px 6px #ffd95a88;animation:p 2.2s ease-in-out infinite}
#intro span{font-size:32px;color:#ffe9a8}
@keyframes p{0%,100%{transform:scale(.7);opacity:.55}50%{transform:scale(1.15);opacity:1}}
#mus{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:12px;z-index:4;font:26px 'VT323',monospace;color:#cfe3ff;opacity:0;background:none;border:0;padding:4px 8px;transition:opacity 2s}
#mus.on{opacity:.55}
#yt{position:fixed;left:0;top:0;width:200px;height:200px;opacity:.001;pointer-events:none;z-index:-1}
#song{bottom:3%;left:50%;right:auto;transform:translateX(-50%);white-space:nowrap;padding:0;font-size:24px;color:#cfe3ff;text-decoration:none}#song.on{pointer-events:auto}
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <div class="txt" id="final"></div>
  <div class="txt" id="sign"></div>
  <div class="txt" id="secret" style="opacity:0"></div>
  <div class="txt" id="days" style="opacity:0"></div>
  <div class="txt" id="bubble" style="opacity:0">loki</div>
  <a class="txt" id="song" target="_blank" rel="noopener">🎧 una canción para vos</a>
</div></div>
<button id="mus" aria-label="música">♪</button>
<div id="intro"><i></i><span id="introTxt"></span></div>

<script>
/* ====== TEXTOS (editá acá lo que quieras) ====== */
const CFG={
  start:'hola peque, tocá para empezar',
  final:'te amo con todo mi corazón',
  sign:'-tu pollito amarillito 🐥',
  secret:'gracias por aparecer en mi vida bostero lindo',
  since:[2026,10,11],            // año, mes, día en que empezó todo
  song:'https://open.spotify.com/intl-es/track/7IL8PSVwLOJxqYne6azxQv?si=af5a252756ef435d'  // canción que se abre desde el final
};
/* =============================================== */
const $=id=>document.getElementById(id);
$('introTxt').textContent=CFG.start;$('song').href=CFG.song;
const C=$('c'),X=C.getContext('2d');
let W=170,H=360,T=0,started=false,caught=0,doneAt=0,lastNote=0;
const N=46,S=2.3,R=17;
function size(){const iw=innerWidth,ih=innerHeight,cw=Math.min(iw,ih*.62);$('wrap').style.width=cw+'px';H=Math.round(W*ih/cw);C.width=W;C.height=H}
size();addEventListener('resize',size);

const mix=(a,b,t)=>`rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join()})`;
const disc=(cx,cy,r,col,a)=>{X.fillStyle=col;X.globalAlpha=a;cx=Math.round(cx);cy=Math.round(cy);for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r-y*y));X.fillRect(cx-w,cy+y,w*2+1,1)}X.globalAlpha=1};
const back=x=>H*.755+2.5*Math.sin(x*.045+1)+1.2*Math.sin(x*.11);
const front=x=>H*.845+2*Math.sin(x*.06+3)+1.2*Math.sin(x*.15);
const stars=[...Array(70)].map(()=>({x:Math.random(),y:Math.random()*.57,p:Math.random()*6,b:Math.random()<.15}));

/* corazón */
const used=Array(N).fill(0);
const sp=i=>{const t=i/N*Math.PI*2;return{x:W/2+16*Math.pow(Math.sin(t),3)*S,y:H*.4-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*S}};
const F=[...Array(N)].map(()=>({x:8+Math.random()*(W-16),y:H*.15+Math.random()*H*.52,a:Math.random()*6.28,s:.18+Math.random()*.25,ph:Math.random()*6,st:0,slot:-1}));
const SEC={x:W*.3,y:H*.76,a:1,found:false};

/* audio */
let AC;const SC=[523.25,587.33,659.25,783.99,880,1046.5];
function note(f,t=0,v=1,dest){if(!AC)return;const n=AC.currentTime+t,o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain();o.type='triangle';o2.type='sine';o.frequency.value=f;o2.frequency.value=f*2;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(.045*v,n+.012);g.gain.exponentialRampToValueAtTime(.0001,n+1.6);o.connect(g);o2.connect(g);g.connect(dest||AC.destination);o.start(n);o2.start(n);o.stop(n+1.7);o2.stop(n+1.7)}
const CH=[[220,261.63,329.63,440,523.25],[174.61,220,261.63,349.23,440],[261.63,329.63,392,523.25,659.25],[196,246.94,293.66,392,493.88]],PAT=[0,2,3,2,4,3,2,1];
let MUS,musOn=true,beat=0;
function bar(){if(!AC)return;const c=CH[beat%4];note(c[0]/2,.05,1.1,MUS);PAT.forEach((k,i)=>note(c[k],.05+i*.5,i%2?.5:.7,MUS));beat++}
function startMusic(){if(!AC)return;MUS=AC.createGain();MUS.gain.value=.8;MUS.connect(AC.destination);bar();setInterval(bar,4000)}
$('mus').onclick=()=>{if(!MUS)return;musOn=!musOn;MUS.gain.value=musOn?.8:0;$('mus').style.textDecoration=musOn?'none':'line-through'};

/* utilidades de texto */
function flash(el,ms){el.style.opacity=1;clearTimeout(el._t);el._t=setTimeout(()=>el.style.opacity=0,ms)}
function daysTxt(){const d=new Date(),a=new Date(d.getFullYear(),d.getMonth(),d.getDate()),b=new Date(CFG.since[0],CFG.since[1]-1,CFG.since[2]),n=Math.round((a-b)/864e5);return n<=0?'hoy empezó todo 💛':`hace ${n} ${n==1?'día':'días'} que empezó todo 💛`}

/* inicio */
$('intro').addEventListener('click',()=>{if(started)return;started=true;try{AC=new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}startMusic();$('intro').classList.add('off');$('mus').classList.add('on')});

/* interacción */
const moon=()=>({x:W*.8,y:H*.1}),catPos=()=>{const x=Math.round(W*.76);return{x:x,y:Math.round(back(x))-4}};
function takeSlot(f){let b=-1,bd=1e9;for(let i=0;i<N;i++){if(used[i])continue;const p=sp(i),d=(p.x-f.x)**2+(p.y-f.y)**2;if(d<bd){bd=d;b=i}}if(b<0)return;used[b]=1;f.slot=b;f.st=1;caught++;if(T-lastNote>.07){lastNote=T;note(SC[caught%6])}}
function grab(lx,ly){for(const f of F)if(f.st===0&&Math.hypot(f.x-lx,f.y-ly)<R)takeSlot(f)}
let down=false;
const pt=e=>{const r=C.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}};
C.addEventListener('pointerdown',e=>{if(!started)return;down=true;const p=pt(e);
  if(Math.hypot(SEC.x-p.x,SEC.y-p.y)<15){SEC.found=true;$('secret').textContent=CFG.secret;flash($('secret'),5000);note(1046.5,0,1.3);note(1318.5,.12,1.3);return}
  const m=moon();if(Math.hypot(m.x-p.x,m.y-p.y)<12){$('days').textContent=daysTxt();flash($('days'),4500);note(659.25);return}
  const c=catPos();if(Math.hypot(c.x-p.x,c.y-p.y)<13){const b=$('bubble'),r=C.getBoundingClientRect();b.style.left=(c.x/W*100)+'%';b.style.top=((c.y-14)/H*100)+'%';flash(b,1300);note(392,0,.9);note(493.88,.1,.9);return}
  grab(p.x,p.y)});
C.addEventListener('pointermove',e=>{if(!started)return;if(down||e.pointerType==='mouse'){const p=pt(e);grab(p.x,p.y)}});
addEventListener('pointerup',()=>down=false);

/* dibujo */
const CAT=['..#....#..','..##..##..','..######..','..######..','...####...','..######..','.########.','.########.','.########.','.########.'];
function ff(x,y,col,a,k){x=Math.round(x);y=Math.round(y);X.fillStyle=col;X.globalAlpha=.1*a*k;X.fillRect(x-3,y-3,7,7);X.globalAlpha=.25*a*k;X.fillRect(x-2,y-1,5,3);X.fillRect(x-1,y-2,3,5);X.globalAlpha=a;X.fillRect(x-1,y-1,2,2);X.globalAlpha=1}
function scene(){
  const hz=Math.round(H*.6);
  for(let y=0;y<hz;y+=2){X.fillStyle=mix([5,11,31],[27,75,134],Math.pow(y/hz,1.6));X.fillRect(0,y,W,2)}
  for(const s of stars){X.globalAlpha=.35+.65*Math.abs(Math.sin(T*1.2+s.p));X.fillStyle='#dfe9ff';const z=s.b?2:1;X.fillRect(Math.round(s.x*W),Math.round(s.y*H),z,z)}X.globalAlpha=1;
  for(let y=hz;y<H*.86;y+=2){X.fillStyle=mix([16,52,106],[8,24,58],(y-hz)/(H*.26));X.fillRect(0,y,W,2)}
  X.fillStyle='#6fa3dc';X.globalAlpha=.45;X.fillRect(0,hz,W,1);X.globalAlpha=1;
  const m=moon();disc(m.x,m.y,16,'#f6ecc0',.04);disc(m.x,m.y,11,'#f6ecc0',.07);disc(m.x,m.y,6,'#f6ecc0',1);X.fillStyle='#e2d6a2';X.fillRect(Math.round(m.x)-2,Math.round(m.y)-2,2,2);X.fillRect(Math.round(m.x)+1,Math.round(m.y)+1,2,1);
  X.fillStyle='#f6ecc0';for(let y=hz+2;y<hz+H*.12;y+=2){const w=2+(y-hz)*.12+Math.sin(T*2+y)*1.6;X.globalAlpha=.5-(y-hz)/(H*.3);X.fillRect(Math.round(m.x-w/2),y,Math.round(w),1)}X.globalAlpha=1;
  const lx=Math.round(W*.14);X.fillStyle='#071022';X.fillRect(lx-5,hz-2,10,3);X.fillStyle='#0b1733';X.fillRect(lx-1,hz-14,3,12);X.fillRect(lx-2,hz-18,5,1);X.fillStyle='#24407a';X.fillRect(lx-1,hz-9,3,1);ff(lx,hz-16,'#ffd95a',.55+.45*Math.sin(T*1.3),1.2);
  X.fillStyle='#0f3a30';for(let x=0;x<W;x++)X.fillRect(x,Math.round(back(x)),1,H);
  const c=catPos(),x0=c.x-5,y0=Math.round(back(c.x))-8;X.fillStyle='#03070f';
  CAT.forEach((r,j)=>{for(let i=0;i<10;i++)if(r[i]==='#')X.fillRect(x0+i,y0+j,1,1)});
  for(let k=0;k<5;k++)X.fillRect(x0+10+(k>=2?Math.round(Math.sin(T*2.2+k)*(k-1)*.7):0)+(k===4?1:0),y0+9-k,1,1);
  X.fillStyle='#08221c';for(let x=0;x<W;x++)X.fillRect(x,Math.round(front(x)),1,H);
  for(let x=0;x<W;x+=3){const h=2+(x*7)%3,sw=Math.round(Math.sin(T*1.5+x));X.fillStyle=x%2?'#0d3b2b':'#124a35';X.fillRect(x+sw,Math.round(front(x))-h,1,h+1)}
}
function step(){
  let settled=0;
  F.forEach((f,i)=>{
    if(f.st===0){f.a+=(Math.random()-.5)*.25;f.x+=Math.cos(f.a)*f.s;f.y+=Math.sin(f.a)*f.s;if(f.x<6||f.x>W-6){f.a=Math.PI-f.a;f.x=Math.max(6,Math.min(W-6,f.x))}if(f.y<H*.12||f.y>H*.72){f.a=-f.a;f.y=Math.max(H*.12,Math.min(H*.72,f.y))}}
    else{const p=sp(f.slot);f.x+=(p.x-f.x)*.07;f.y+=(p.y-f.y)*.07;if(Math.hypot(p.x-f.x,p.y-f.y)<.6)f.st=2;if(f.st===2)settled++}
  });
  if(settled===N&&!doneAt){doneAt=T;$('final').textContent=CFG.final;$('sign').textContent=CFG.sign;$('final').classList.add('on');setTimeout(()=>$('sign').classList.add('on'),2200);setTimeout(()=>$('song').classList.add('on'),4500);[0,1,3,4,5].forEach((n,i)=>note(SC[n],i*.16,1.2))}
  SEC.a+=(Math.random()-.5)*.2;SEC.x+=Math.cos(SEC.a)*.12;SEC.y+=Math.sin(SEC.a)*.1;
  if(SEC.x<8||SEC.x>W-8)SEC.a=Math.PI-SEC.a;if(SEC.y<H*.7||SEC.y>H*.82)SEC.a=-SEC.a;SEC.x=Math.max(8,Math.min(W-8,SEC.x));SEC.y=Math.max(H*.7,Math.min(H*.82,SEC.y));
}
function frame(){
  T+=.016;step();scene();
  if(doneAt){const k=Math.min(1,(T-doneAt)/2),pl=Math.sin(T*2.4)*.5+.5,hc=sp(0);const cy=H*.4-2*S;disc(W/2,cy,46,'#ffd95a',.025*k*(.6+pl));disc(W/2,cy,36,'#ffd95a',.035*k*(.6+pl));disc(W/2,cy,26,'#ffe9a8',.04*k)}
  F.forEach((f,i)=>{const a=.6+.4*Math.sin(T*2.4+f.ph);let x=f.x,y=f.y;if(f.st===2){x+=Math.sin(T*2+i)*.4;y+=Math.cos(T*1.7+i)*.4}ff(x,y,'#ffd95a',f.st===2&&doneAt?.9+.1*Math.sin(T*3+i):a,doneAt?1.7:(f.st?1.3:1))});
  ff(SEC.x,SEC.y,'#8fe3ff',.3+.35*Math.abs(Math.sin(T*1.1)),1);
  requestAnimationFrame(frame)}
frame();
</script>
</body>
</html>
